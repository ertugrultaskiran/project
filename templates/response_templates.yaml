  greeting_uncertain: "📋 Bu satın alma departmanıyla ilgili görünüyor."
  greeting_urgent: "🚨 Acil satın alma talebinizi yönlendiriyorum!"
  
  urgent_steps:
    - "Satın alma portalı: https://purchase.company.com"
    - "Acil onay için müdürünüzle görüşün"
    - "Procurement team: procurement@company.com"
  
  standard_steps:
    - "Satın alma formu doldurun"
    - "Bütçe kodu alın (finans departmanından)"
    - "3 teklif toplayın (şirket politikası)"
    - "Yönetici onayı alın"
