# IT Ticket Conversational Response Templates
# Turkish & English Support

Hardware:
  greeting_confident: "✅ Donanım sorununu net bir şekilde tespit ettim."
  greeting_uncertain: "📋 Bu muhtemelen bir donanım problemi gibi görünüyor."
  greeting_urgent: "🚨 Acil donanım sorununuzu anlıyorum, hemen bakalım!"
  
  urgent_steps:
    - "Cihazı tamamen kapatıp 30 saniye bekleyin, sonra tekrar açın"
    - "Tüm kabloların (güç, HDMI, USB) sağlam takıldığını kontrol edin"
    - "Farklı bir güç kaynağına veya prize bağlayın"
    - "Laptop ise bataryayı çıkarıp sadece adaptörle çalıştırmayı deneyin"
  
  standard_steps:
    - "Bilgisayarı yeniden başlatın (soft reset)"
    - "BIOS/UEFI ekranına girebiliyor musunuz kontrol edin (F2 veya Del tuşu)"
    - "Harici cihazları (USB, harici disk) çıkarıp deneyin"
    - "Sistem loglarını kontrol edin (Windows: Event Viewer)"
    - "Donanım diagnostics aracını çalıştırın"
  
  question_response: |
    Donanım sorunlarında en sık karşılaşılan problemler:
    • Güç kaynaklı: Adaptör, pil, anakart güç devresi
    • RAM problemleri: Bellek hatası, kötü slot
    • Disk arızaları: HDD/SSD okuma hatası
    • Ekran sorunları: Panel, kablo, grafik kartı
  
  eta: "15-30 dakika (basit sorunlar için)"
  escalation_threshold: 3
  priority_keywords: ["açılmıyor", "yanmıyor", "kırık", "bozuk", "çalışmıyor"]

Access:
  greeting_confident: "✅ Erişim sorununuzu tespit ettim, hemen çözelim."
  greeting_uncertain: "📋 Bu bir erişim/yetkilendirme problemi olabilir."
  greeting_urgent: "🚨 Acil erişim sorununuzu çözüyorum!"
  
  urgent_steps:
    - "Şifre sıfırlama self-service: https://password-reset.company.com"
    - "Hesap kilitliyse IT helpdesk: (555) 123-4567"
    - "VPN bağlantınızı kontrol edin ve yeniden bağlanın"
  
  standard_steps:
    - "Caps Lock kapalı olduğundan emin olun"
    - "Kullanıcı adınızı kontrol edin (@domain.com ekli mi?)"
    - "Farklı bir tarayıcı veya incognito modda deneyin"
    - "Tarayıcı cache ve cookies'leri temizleyin"
    - "VPN üzerinden bağlanmanız gerekiyorsa kontrol edin"
  
  question_response: |
    Erişim problemlerinin çözümü:
    • Şifre sorunları: Self-service portal kullanın
    • Hesap kilidi: 3 yanlış denemeden sonra 30 dakika kilitleniyor
    • Yetki eksikliği: Yöneticinizden onay gerekir
    • VPN problemleri: Sertifika veya bağlantı sorunu olabilir
  
  eta: "5-10 dakika"
  escalation_threshold: 2
  priority_keywords: ["şifremi unuttum", "giriş yapamıyorum", "erişemiyorum", "kilitlendi"]

Network:
  greeting_confident: "✅ Ağ bağlantı sorununuzu tespit ettim."
  greeting_uncertain: "📋 Bu bir network problemi gibi görünüyor."
  greeting_urgent: "🚨 İnternet bağlantı sorununuzu acil çözüyoruz!"
  
  urgent_steps:
    - "WiFi'yi kapat-aç yapın (veya Airplane mode aç-kapat)"
    - "Router'ı yeniden başlatın (30 saniye kapalı tutun)"
    - "Ethernet kablosu varsa kablolu bağlantı deneyin"
    - "Farklı WiFi ağına bağlanabiliyor musunuz test edin"
  
  standard_steps:
    - "Network troubleshooter çalıştırın (Windows)"
    - "DNS ayarlarını kontrol edin (8.8.8.8 - Google DNS)"
    - "IP adresinizi yenileyin: ipconfig /release ve ipconfig /renew"
    - "Firewall veya antivirus geçici olarak devre dışı bırakıp test edin"
    - "VPN bağlantınızı kontrol edin"
  
  question_response: |
    Network sorunlarının sebepleri:
    • WiFi sinyal gücü zayıf: Router'a yaklaşın
    • ISP problemi: Servis sağlayıcınızı kontrol edin
    • DNS çözümleme hatası: DNS değiştirin
    • IP çakışması: DHCP yenileme yapın
  
  eta: "10-20 dakika"
  escalation_threshold: 3
  priority_keywords: ["internet yok", "bağlanamıyorum", "yavaş", "kopuyor"]

Software:
  greeting_confident: "✅ Yazılım sorununuzu tespit ettim."
  greeting_uncertain: "📋 Bu bir yazılım veya uygulama problemi olabilir."
  greeting_urgent: "🚨 Kritik yazılım sorununuza bakıyorum!"
  
  urgent_steps:
    - "Uygulamayı tamamen kapatıp yeniden açın (Task Manager'dan sonlandırın)"
    - "Bilgisayarı yeniden başlatın"
    - "Uygulamayı yönetici olarak çalıştırmayı deneyin (sağ tık → Run as admin)"
  
  standard_steps:
    - "Yazılımın en son güncellemesini yükleyin"
    - "Uygulamayı kaldırıp yeniden kurun (clean install)"
    - "Uyumluluktmodunu deneyin (Windows 7/8 uyumluluk)"
    - "Log dosyalarını kontrol edin (genelde C:\\Program Files\\App\\logs)"
    - "Lisans durumunu kontrol edin"
  
  question_response: |
    Yazılım problemleri:
    • Çökme/donma: Genelde bellek veya uyumluluk sorunu
    • Açılmıyor: .NET Framework, Visual C++ gibi dependencies eksik
    • Lisans hatası: Aktivasyon veya süre bitimi
    • Yavaşlık: Arka planda çalışan süreçler
  
  eta: "10-30 dakika"
  escalation_threshold: 3
  priority_keywords: ["açılmıyor", "donuyor", "hata veriyor", "crash"]

