  urgent_steps:
    - "İK self-service portal: https://hr.company.com"
    - "Acil durumlar için İK hotline: (555) HR-HELP"
    - "E-posta: hr@company.com"
  
  standard_steps:
    - "İK portalına giriş yapın: https://hr.company.com"
    - "İlgili formu doldurun (izin, bordro, vb.)"
    - "Gerekli belgeleri yükleyin"
    - "Onay için yöneticinize bildirim gidecektir"
  
  question_response: |
    İK süreçleri:
    • İzin talepleri: 3 gün önceden bildirim gerekir
    • Bordro sorunları: Maaş günü: Her ayın 30'u
    • Belgeler: İK portalından indirebilirsiniz
    • Performans: Yıllık değerlendirme Aralık ayında
  
  eta: "1-2 iş günü"
  escalation_threshold: 1
  priority_keywords: ["izin", "maaş", "bordro", "belge"]

Purchase:
