  escalation_threshold: 1
  priority_keywords: ["sipariş", "satın alma", "onay", "bütçe"]

Storage:
  greeting_confident: "✅ Depolama sorununuzu tespit ettim."
  greeting_uncertain: "📋 Bu bir disk alanı/yedekleme problemi olabilir."
  greeting_urgent: "🚨 Kritik depolama sorununuza bakıyorum!"
  
  urgent_steps:
    - "Gereksiz dosyaları hemen silin (Downloads, Temp klasörleri)"
    - "Recycle Bin'i boşaltın"
    - "Büyük dosyaları OneDrive veya network drive'a taşıyın"
  
  standard_steps:
    - "Disk Cleanup aracını çalıştırın (Windows)"
    - "Eski Windows update dosyalarını silin"
    - "Program kaldırma: Kullanmadığınız uygulamaları kaldırın"
    - "Dosyaları cloud'a taşıyın (OneDrive, Google Drive)"
    - "IT'den disk kapasitesi artırımı talep edin"
  
  question_response: |
    Depolama yönetimi:
    • Kotanız: Kullanıcı başına 50 GB yerel, 1 TB cloud
    • Yedekleme: Otomatik olarak her gece yapılır
    • Arşivleme: 1 yıldan eski dosyalar otomatik arşivlenir
    • Genişletme: Talep formu IT departmanına
  
  eta: "15-30 dakika"
  escalation_threshold: 2
  priority_keywords: ["disk dolu", "yer kalmadı", "yedekleme", "kaydedemiyorum"]

